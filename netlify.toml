# Netlify config. Owned by Agent B (see AGENTS.md).

[build]
  publish = "."

# Keep project docs off the public site.
[[redirects]]
  from = "/SPEC.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/AGENTS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
